name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs cancel their superseded runs. Pushes to main never cancel: the migrate
# job below applies schema to production and must run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  # Hermetic: no database, no browser, no secrets. Typecheck, unit + component
  # tests with coverage thresholds (vitest.config.ts).
  check:
    name: Typecheck, unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two files with the same version stamp make `supabase db push` refuse the
      # whole directory. Catch it on the PR, not on main.
      - name: Migration versions are unique
        run: |
          dups=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration versions: $dups"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14

  # Real database and real browser. A local Supabase stack (migrations applied
  # on start) is seeded with a small catalog, then:
  #   1. the integration project runs against it (org scoping, auth trigger)
  #   2. the app is built and started against it
  #   3. Playwright drives the built app end to end
  integration:
    name: Integration and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime

      - name: Export Supabase credentials
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          } >> "$GITHUB_ENV"

      - name: Seed the catalog
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f e2e/seed.sql

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Merging to main is what applies a migration to production. Nothing else
  # should: no psql, no Studio SQL editor. Runs only after the hermetic checks
  # and the integration run (which replayed every migration from scratch on a
  # fresh local stack) both pass.
  #
  # Needs two repository secrets:
  #   SUPABASE_ACCESS_TOKEN  personal access token, supabase.com/dashboard/account/tokens
  #   SUPABASE_DB_PASSWORD   the project's postgres password (the one in CATALOG_DATABASE_URL)
  migrate:
    name: Apply migrations to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: euhyuodaylryedwnvwdd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # --include-all: apply every local file the remote history lacks, even
      # one whose timestamp is older than the remote head (two PRs merged out
      # of timestamp order). Each file runs in its own transaction.
      - name: Push pending migrations
        run: supabase db push --linked --include-all --yes

      # Drift check. After the push, every local file must have a remote row
      # and every remote row a local file. A one-sided row means someone
      # applied or recorded something outside this job.
      - name: Verify history matches
        run: |
          supabase migration list --linked | tee migration-list.txt
          if grep -E '^\s*[0-9]{14}\s*\|\s*\|' migration-list.txt; then
            echo "::error::Local migrations with no remote history row (push did not apply them)"
            exit 1
          fi
          if grep -E '^\s*\|\s*[0-9]{14}' migration-list.txt; then
            echo "::error::Remote history rows with no local file. Someone applied a migration outside CI; add the file or repair the history."
            exit 1
          fi
